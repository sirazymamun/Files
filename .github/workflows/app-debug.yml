name: Build Files APK

on:
  push:
    branches: [main, master]
    paths: ['source.zip', 'apk-version.txt', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: files-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read APK version
        shell: bash
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < apk-version.txt)
          if [[ ! "$VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'apk-version.txt must contain a version such as 7.1.13'
            exit 1
          fi
          MAJ=${BASH_REMATCH[1]}
          MIN=${BASH_REMATCH[2]}
          PAT=${BASH_REMATCH[3]}
          echo "CODE=$((10#$MAJ * 1000000 + 10#$MIN * 10000 + 10#$PAT))" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Unpack source.zip
        run: unzip -q source.zip -d project

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Select signing mode
        env:
          KEY_B64: ${{ secrets.FILES_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FILES_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FILES_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FILES_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64$STORE_PASS$KEY_ALIAS$KEY_PASS" ]]; then
            echo 'VARIANT=Debug' >> "$GITHUB_ENV"
            echo 'APK_DIR=debug' >> "$GITHUB_ENV"
            echo 'MODE=Debug' >> "$GITHUB_ENV"
            echo 'No release signing configured; building a debug APK.'
          elif [[ -z "$KEY_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo 'Configure all four FILES_RELEASE signing secrets.'
            exit 1
          else
            umask 077
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/files-release.jks"
            echo "FILES_RELEASE_STORE_FILE=$RUNNER_TEMP/files-release.jks" >> "$GITHUB_ENV"
            echo 'VARIANT=Release' >> "$GITHUB_ENV"
            echo 'APK_DIR=release' >> "$GITHUB_ENV"
            echo 'MODE=Release' >> "$GITHUB_ENV"
          fi

      - name: Test and build APK
        working-directory: project
        env:
          FILES_RELEASE_STORE_PASSWORD: ${{ secrets.FILES_RELEASE_STORE_PASSWORD }}
          FILES_RELEASE_KEY_ALIAS: ${{ secrets.FILES_RELEASE_KEY_ALIAS }}
          FILES_RELEASE_KEY_PASSWORD: ${{ secrets.FILES_RELEASE_KEY_PASSWORD }}
        run: >-
          gradle :app:testDebugUnitTest ":app:assemble${VARIANT}" --no-daemon
          -PappVersion="${VER}"
          -PappVersionCode=${{ env.CODE }}

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/files-release.jks"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: project/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Name APK
        run: cp "project/app/build/outputs/apk/${APK_DIR}/app-${APK_DIR}.apk" "Files-v${VER}.apk"

      - name: Export public signing certificate details
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "Files-v${VER}.apk" > signing-certificate.txt
          printf '\nPackage: com.example.httpsserver\nVersion: %s\n' "$VER" >> signing-certificate.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Files-v${{ env.VER }}
          path: |
            Files-v${{ env.VER }}.apk
            signing-certificate.txt
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${VER}" >/dev/null 2>&1; then
            gh release upload "v${VER}" "Files-v${VER}.apk" signing-certificate.txt --clobber
          else
            gh release create "v${VER}" "Files-v${VER}.apk" signing-certificate.txt --title "Files v${VER}" --notes "${MODE} APK v${VER}; signing mode: ${MODE}"
          fi
